version: '3.8'

services:
  dte-fdm-api:
    build:
      context: ./DTE-FDM-serve
      dockerfile: Dockerfile
    container_name: dte_fdm_server
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace/fakeshield
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command: uvicorn DTE-FDM-serve.main:app --host 0.0.0.0 --port 8001 --reload

  mflm-api:
    build:
      context: ./MFLM-serve
      dockerfile: Dockerfile
    container_name: mflm_server
    ports:
      - "8002:8002"
    volumes:
      - .:/workspace/fakeshield
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command: uvicorn MFLM-serve.main:app --host 0.0.0.0 --port 8002 --reload

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway_service
    ports:
      - "8000:8000"
    volumes:
      - ./gateway-service:/workspace/gateway-service
      - ./playground:/workspace/playground
    ipc: host
    command: uvicorn gateway-service.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      dte-fdm-api:
        condition: service_started
      mflm-api:
        condition: service_started
